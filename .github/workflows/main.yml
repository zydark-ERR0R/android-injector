name: Build Android Injector

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build-arm64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK r22
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r22-linux-x86_64.zip
          unzip -q android-ndk-r22-linux-x86_64.zip
          rm android-ndk-r22-linux-x86_64.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r22" >> $GITHUB_ENV

      - name: Build with ndk-build
        run: |
          cd $GITHUB_WORKSPACE
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-29 \
            -j$(nproc)

      - name: List output directories
        run: |
          echo "=== libs/ ==="
          find libs -type f 2>/dev/null || echo "libs/ empty or missing"
          echo "=== obj/ ==="
          find obj -type f 2>/dev/null | head -50 || echo "obj/ empty or missing"
          echo "=== libs/arm64-v8a ==="
          ls -la libs/arm64-v8a/ 2>/dev/null || echo "libs/arm64-v8a/ missing"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-injector-arm64
          path: |
            libs/arm64-v8a/*
            obj/local/arm64-v8a/*
          if-no-files-found: warn
